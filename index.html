<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280" />
    <link rel="icon" type="image/png" href="/fav.png" />
    <link rel="apple-touch-icon" href="/fav.png" />
    <link rel="manifest" href="/manifest.json">
    <title>Usepay</title>
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.addEventListener('error', function(e) {
        var msg = String(e.message || '');
        var filename = String(e.filename || '');
        if (msg.indexOf('OneSignal') !== -1 || msg.indexOf('onesignal') !== -1 || filename.indexOf('onesignal') !== -1) {
          return; // Ignore OneSignal script errors
        }
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = '#fecaca';
        div.style.color = '#991b1b';
        div.style.padding = '15px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '12px';
        div.style.whiteSpace = 'pre-wrap';
        div.style.borderBottom = '3px solid #ef4444';
        div.innerText = 'JS Error: ' + e.message + '\nAt: ' + e.filename + ':' + e.lineno;
        document.body.appendChild(div);
      });
      window.addEventListener('unhandledrejection', function(e) {
        var reasonStr = String(e.reason || '');
        if (reasonStr.indexOf('OneSignal') !== -1 || reasonStr.indexOf('onesignal') !== -1) {
          return; // Ignore OneSignal background promise rejections
        }
        var div = document.createElement('div');
        div.style.position = 'fixed';
        div.style.top = '0';
        div.style.left = '0';
        div.style.width = '100%';
        div.style.background = '#fde047';
        div.style.color = '#854d0e';
        div.style.padding = '15px';
        div.style.zIndex = '999999';
        div.style.fontFamily = 'monospace';
        div.style.fontSize = '12px';
        div.style.whiteSpace = 'pre-wrap';
        div.style.borderBottom = '3px solid #eab308';
        div.innerText = 'Promise Reject: ' + e.reason;
        document.body.appendChild(div);
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
